# Maestro configuration for SWP HRIS mobile testing.
#
# Flows are located in ./flows/.
# Each flow can be run individually:
#   maestro test flows/clock-in.yaml
# Or run all flows:
#   maestro test flows/

flows:
  - clock-in
  - leave-request
  - overtime-request
  - attendance-activity

# Default environment variables used across flows.
# Override via CLI: maestro test -e EMAIL=other@test flows/clock-in.yaml
env:
  EMAIL: agent@swp.test
  PASSWORD: password123

# Timeout for each flow command (milliseconds).
timeout: 60000

# Retry policy for flaky elements.
retries: 1

# App settings.
appId: com.hariszaki17.swphris
