                    data: []
                    next_cursor: null
                    has_more: false
                    meta:
                      code: PERIOD_NOT_LOCKED
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-rbac:
        roles: [hr_admin, super_admin]
        scope: global

  # ─────────────────────────────────────────────────────────────────────
  # Clarifications (F8.5, PC-13) — thin one-round back-channel
  # ─────────────────────────────────────────────────────────────────────

  /clarifications:
    post:
      tags: [clarifications]
      summary: Raise a clarification on a record
      operationId: createClarification
      description: |
        HR raises a `ClarificationRequest` on a specific attendance / OT / leave
        record (PC-13). The server resolves the **target** automatically — the
        record's company shift leader, else the agent (C-PC-6 fallback) — and
        sends an E10 notification (push + in-app, deep-linked). The clarification
        starts `OPEN`. Advisory only: it blocks no lock, but an `OPEN`
        clarification surfaces in the cockpit as "awaiting reply".
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClarificationCreate'
            examples:
              attendance:
                value:
                  source_type: ATTENDANCE
                  source_id: SWP-ATT-77310
                  question: "Mengapa check-out kosong pada 14 Juni? Mohon konfirmasi jam pulang."
      responses:
        '201':
          description: Clarification raised; target notified.
          headers:
            Location:
              description: URL shape for the created clarification.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClarificationRequest'
              examples:
                created:
                  value:
                    id: SWP-CLR-3001
                    source_type: ATTENDANCE
                    source_id: SWP-ATT-77310
                    period_id: SWP-PP-2025-06
                    status: OPEN
                    question: "Mengapa check-out kosong pada 14 Juni? Mohon konfirmasi jam pulang."
                    raised_by: SWP-EMP-9001
                    target_employee_id: SWP-EMP-1500
                    answer: null
                    answered_by: null
                    answered_at: null
                    created_at: "2025-06-30T02:00:00Z"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Idempotency key reused with a different body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-rbac:
        roles: [hr_admin, super_admin]
        scope: global

  /clarifications/{id}:answer:
    parameters:
      - $ref: '#/components/parameters/ClarificationId'

    post:
      tags: [clarifications]
      summary: Answer a clarification (target)
      operationId: answerClarification
      description: |
        The **target** (the record's shift leader or the agent) answers with a
        note, transitioning `OPEN → ANSWERED` (PC-13). The target may
        additionally file a correction (E5 F5.4) which routes normally through
        E11 — that is a separate call, not part of this body.

        **RBAC:** scope-checked to the **target** — only the resolved
        `target_employee_id` (or its shift leader) may answer; anyone else gets
        `403 OUT_OF_SCOPE`. Answering an already-`RESOLVED` / `CANCELLED`
        clarification returns `409 CLARIFICATION_NOT_OPEN`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClarificationAnswer'
            examples:
              answer:
                value:
                  answer: "Agen lupa absen pulang; sudah saya ajukan koreksi (correction SWP-COR-441)."
      responses:
        '200':
          description: Clarification answered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClarificationRequest'
              examples:
                answered:
                  value:
                    id: SWP-CLR-3001
                    source_type: ATTENDANCE
                    source_id: SWP-ATT-77310
                    period_id: SWP-PP-2025-06
                    status: ANSWERED
                    question: "Mengapa check-out kosong pada 14 Juni? Mohon konfirmasi jam pulang."
                    raised_by: SWP-EMP-9001
                    target_employee_id: SWP-EMP-1500
                    answer: "Agen lupa absen pulang; sudah saya ajukan koreksi (correction SWP-COR-441)."
                    answered_by: SWP-EMP-1500
                    answered_at: "2025-06-30T06:30:00Z"
                    created_at: "2025-06-30T02:00:00Z"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: Caller is not the clarification's target (`OUT_OF_SCOPE`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                out_of_scope:
                  value:
                    error:
                      code: OUT_OF_SCOPE
                      message: "Klarifikasi ini bukan ditujukan untuk Anda."
                      request_id: req_01J6XK95
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ClarificationNotOpen'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-rbac:
        scope: target
        notes: "Scope-checked to the clarification target (the record's shift leader or agent)."

  /clarifications/{id}:resolve:
    parameters:
      - $ref: '#/components/parameters/ClarificationId'

    post:
      tags: [clarifications]
      summary: Resolve a clarification (HR closes the loop)
      operationId: resolveClarification
      description: |
        HR closes the loop: `OPEN`/`ANSWERED → RESOLVED` (PC-13). Audited
        (`CLARIFICATION_RESOLVED`). Resolving a `CANCELLED` clarification returns
        `409 CLARIFICATION_NOT_OPEN`.
      responses:
        '200':
          description: Clarification resolved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClarificationRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ClarificationNotOpen'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-rbac:
        roles: [hr_admin, super_admin]
        scope: global

  /clarifications/{id}:cancel:
    parameters:
      - $ref: '#/components/parameters/ClarificationId'

    post:
      tags: [clarifications]
      summary: Cancel a clarification (HR)
      operationId: cancelClarification
      description: |
        HR cancels an in-flight clarification: `OPEN`/`ANSWERED → CANCELLED`
        (PC-13). Audited. Cancelling an already-terminal clarification returns
        `409 CLARIFICATION_NOT_OPEN`.
      responses:
        '200':
          description: Clarification cancelled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClarificationRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ClarificationNotOpen'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-rbac:
        roles: [hr_admin, super_admin]
        scope: global

# ─────────────────────────────────────────────────────────────────────
# Components
# ─────────────────────────────────────────────────────────────────────

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque-or-jwt
      description: |
        See CONVENTIONS §3. Server token format (opaque session vs JWT) is
        deferred to E1; consumers MUST treat the token as opaque.

  parameters:

    PayslipId:
      name: id
      in: path
      required: true
      description: Payslip ID — `SWP-PS-<numeric>` per CONVENTIONS §4.
      schema:
        type: string
        pattern: '^SWP-PS-\d+$'
        example: SWP-PS-90121

    PeriodYear:
      name: year
      in: path
      required: true
      description: Period year (F8.5). Part of the `(year, month)` key (PC-1).
      schema:
        type: integer
        minimum: 2000
        maximum: 2100
        example: 2025

    PeriodMonth:
      name: month
      in: path
      required: true
      description: Period month `1–12` (F8.5). Part of the `(year, month)` key (PC-1).
      schema:
        type: integer
        minimum: 1
        maximum: 12
        example: 6

    ClarificationId:
      name: id
      in: path
      required: true
      description: Clarification ID — `SWP-CLR-<numeric>` per CONVENTIONS §4.
      schema:
        type: string
        pattern: '^SWP-CLR-\d+$'
        example: SWP-CLR-3001

    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from a previous page's `next_cursor`. CONVENTIONS §8.
      required: false
      schema:
        type: string

    Limit:
      name: limit
      in: query
      description: Page size. Default 50, max 200. CONVENTIONS §8.
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50

    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        UUID v4 chosen by the client. Server caches the response for 24h
        keyed by (caller, key). CONVENTIONS §13.
      schema:
        type: string
        format: uuid

  schemas:

    # ───────── Money & enums ─────────

    Money:
      type: string
      nullable: true
      description: |
        IDR monetary amount as a decimal string with exactly 2 fractional
        digits (e.g. `"7325000.00"`). String — not number — to avoid float
        precision loss client-side. **Nullable** because decrypt-fail
        payslips return `null` for monetary fields (paired with
        `locked_reason: "decrypt_fail"` at the parent level).
      pattern: '^-?\d+\.\d{2}$'
      example: "7325000.00"

    PayslipStatus:
      type: string
      enum:
        - FINAL
        - DECRYPT_FAIL
      description: |
        - `FINAL` — record decrypted successfully; monetary fields populated.
        - `DECRYPT_FAIL` — legacy `DBEncryption` decryption failed for one or
          more monetary columns. Surfaced read-only; monetary fields nulled.

    SourceRef:
      type: object
      description: |
        Migration traceability per DATA-MAPPING.md. Present on every payslip
        migrated from `lumen_swp`.
      required: [system, source_id]
      properties:
        system:
          type: string
          enum: [lumen_swp]
          description: Source system identifier (E9).
          example: lumen_swp
        source_id:
          type: string
          description: Legacy primary key (`employee_payslips.id`). String — not parsed.
          example: "44218"

    LockedReason:
      type: string
      enum:
        - decrypt_fail
      description: |
        Reason a value or field group is locked / nulled. v1 has one value;
        more may be added (e.g. `pending_review`, `policy_restricted`) in
        future epics.

    # ───────── Line items ─────────

    EarningLine:
      type: object
      description: |
        One line of the payslip's earnings breakdown (`employee_salaries`
        rows whose component resolves to an earning per
        `employee_salary_columns`). HR/Super Admin only — agents do not see
        line items per INV-3 / PH-5.

        On `DECRYPT_FAIL` payslips, the parent `earnings` array is an empty
        array (`[]`) — individual lines are not surfaced because their
        encrypted `value` could not be read.
      required: [name, value]
      properties:
        name:
          type: string
          description: Component display name (denormalized from `employee_salary_columns.name`).
          example: "Gaji Pokok"
        value:
          $ref: '#/components/schemas/Money'
        for_bpjs:
          type: boolean
          description: Mirrors legacy `is_amount_for_bpjs` — included in the BPJS calculation base.
          example: true
        locked_reason:
          $ref: '#/components/schemas/LockedReason'

    DeductionLine:
      type: object
      description: |
        One line of the payslip's deductions breakdown. Same source shape as
        `EarningLine` but resolved to a deduction component. HR-only.
      required: [name, value]
      properties:
        name:
          type: string
          example: "BPJS Kesehatan (1%)"
        value:
          $ref: '#/components/schemas/Money'
        for_bpjs:
          type: boolean
          example: true
        locked_reason:
          $ref: '#/components/schemas/LockedReason'

    BenefitLine:
      type: object
      description: |
        Employer-borne benefit attached to the employee at this payslip's
        period (`employee_benefits`). HR-only per INV-4. Decoupled from the
        payslip — a benefit may exist independently of a specific payslip
        (PA-1 C-2); when surfaced through the payslip endpoint, only the
        benefits applicable to that period are included.
      required: [name, value]
      properties:
        name:
          type: string
          example: "BPJS Kesehatan (employer 4%)"
        value:
          $ref: '#/components/schemas/Money'
        locked_reason:
          $ref: '#/components/schemas/LockedReason'

    # ───────── Payslip ─────────

    Payslip:
      type: object
      description: |
        A historical payslip. Migrated from `lumen_swp.employee_payslips`
        per DATA-MAPPING.md. Read-only in v1.

        **Field nulling under decrypt failure** (DATA-MAPPING G-1 / PH-1 C-2 /
        PA-1 C-1):

        | Field | FINAL | DECRYPT_FAIL |
        |---|---|---|
        | `working_days` | int | `null` (when stored on an encrypted column) |
        | `gross_earnings` | `Money` | `null` |
        | `gross_deductions` | `Money` | `null` |
        | `take_home_pay` | `Money` | `null` |
        | `earnings`, `deductions`, `benefits` (HR) | populated | `[]` |
        | `status` | `FINAL` | `DECRYPT_FAIL` |
        | `decrypt_fail` | `false` | `true` |
        | `locked_reason` | absent | `"decrypt_fail"` |
        | non-monetary metadata (period, employee, source, paid_on) | populated | populated |

        **Agent view (INV-3 / PH-5):** the `earnings`, `deductions`, and
        `benefits` arrays are **omitted entirely** from the response body
        when the caller is an agent. Summary monetary totals
        (`gross_earnings`, `gross_deductions`, `take_home_pay`) remain.
      required:
        - id
        - employee_id
        - year
        - month
        - period
        - paid_on
        - status
        - decrypt_fail
        - read_only
        - source
      properties:
        id:
          type: string
          pattern: '^SWP-PS-\d+$'
          example: SWP-PS-90121
        employee_id:
          type: string
          description: Resolves via E2 (`GET /api/v1/employees/{id}`).
          example: SWP-EMP-1042
        employee_name:
          type: string
          nullable: true
          description: |
            Display-only convenience field (denormalized from E2). Clients
            should still resolve via E2 if they need authoritative current
            data. Nullable when the employee was hard-deleted post-migration
            (rare; soft-delete is the norm).
          example: Budi Santoso
        year:
          type: integer
          minimum: 2000
          maximum: 2100
          example: 2025
        month:
          type: integer
          minimum: 1
          maximum: 12
          example: 12
        period:
          type: string
          description: Convenience field — `YYYY-MM`. Matches `year` + `month`.
          pattern: '^\d{4}-(0[1-9]|1[0-2])$'
          example: "2025-12"
        paid_on:
          type: string
          format: date
          nullable: true
          description: Pay date (legacy `tanggal_dibayarkan`).
          example: "2025-12-28"
        working_days:
          type: integer
          nullable: true
          minimum: 0
          maximum: 31
          description: |
            Working days in the period (legacy `total_hari_kerja`, cast
            string→int per DATA-MAPPING). `null` when on an encrypted column
            and decrypt failed.
          example: 22
        gross_earnings:
          $ref: '#/components/schemas/Money'
        gross_deductions:
          $ref: '#/components/schemas/Money'
        take_home_pay:
          $ref: '#/components/schemas/Money'
        status:
          $ref: '#/components/schemas/PayslipStatus'
        decrypt_fail:
          type: boolean
          description: |
            `true` iff at least one encrypted monetary column could not be
            decrypted. Convenience flag — equivalent to
            `status === "DECRYPT_FAIL"`. Surfaced for client UI gating
            (Wave-1 "Perlu review" warn chip).
          example: false
        read_only:
          type: boolean
          description: |
            Always `true` in v1 per INV-1 / PH-4 / PA-4. Returned for
            forward-compatibility with a future active-payroll epic.
          example: true
        locked_reason:
          $ref: '#/components/schemas/LockedReason'
        earnings:
          type: array
          description: |
            HR/Super Admin only (INV-3 / INV-4 / PH-5). Omitted from agent
            responses. Empty array on `DECRYPT_FAIL`.
          items:
            $ref: '#/components/schemas/EarningLine'
        deductions:
          type: array
          description: |
            HR/Super Admin only (INV-3 / INV-4 / PH-5). Omitted from agent
            responses. Empty array on `DECRYPT_FAIL`.
          items:
            $ref: '#/components/schemas/DeductionLine'
        benefits:
          type: array
          description: |
            HR/Super Admin only (INV-4). Omitted from agent responses.
            Empty array on `DECRYPT_FAIL`. Per PA-1 C-2, a benefit may exist
            independently of a payslip — this endpoint only returns benefits
            applicable to the payslip's period.
          items:
            $ref: '#/components/schemas/BenefitLine'
        source:
          $ref: '#/components/schemas/SourceRef'
        created_at:
          type: string
          format: date-time
          description: |
            Migration-write timestamp in Postgres (E9). Not the legacy
            record's creation date.
          example: "2025-12-28T11:02:14Z"

    PayslipListResponse:
      type: object
      required: [data, has_more]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Payslip'
        next_cursor:
          type: string
          nullable: true
          description: Cursor for the next page. `null` when `has_more` is `false`.
        has_more:
          type: boolean
        meta:
          type: object
          description: |
            Optional response metadata. `code: "MISSING_PAYROLL_HISTORY"` is
            set on `data: []` responses so clients can route to the
            "no history" empty state (E8-AUDIT P1 #5).
          properties:
            code:
              type: string
              enum: [MISSING_PAYROLL_HISTORY]

    # ───────── Audit notes ─────────

    PayslipAuditNote:
      type: object
      description: |
        Immutable HR annotation attached to a payslip (PA-7, §8). Notes do
        not modify the payslip itself; they are stored as separate records
        and surfaced on detail / list calls.
      required: [id, payslip_id, text, author_id, created_at]
      properties:
        id:
          type: string
          description: Composite ID — `{payslip_id}-NOTE-{seq}`.
          example: SWP-PS-90119-NOTE-1
        payslip_id:
          type: string
          pattern: '^SWP-PS-\d+$'
          example: SWP-PS-90119
        text:
          type: string
          minLength: 1
          maxLength: 4000
          description: |
            Free-text annotation. Indonesian by default. Plain text only;
            markdown is not rendered.
          example: "Decrypt failed pada migrasi; menunggu rotasi kunci payroll legacy."
        author_id:
          type: string
          description: Employee ID of the HR / Super Admin who appended the note.
          example: SWP-EMP-9001
        author_name:
          type: string
          nullable: true
          description: Denormalized display name (from E2).
          example: Sari Hadi
        created_at:
          type: string
          format: date-time
          example: "2026-05-30T08:14:22Z"

    PayslipAuditNoteCreate:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 4000
          description: |
            The annotation text. Must be non-empty after trim. Markdown is
            not rendered.
          example: "Decrypt failed pada migrasi 2026-05-30; ditahan untuk review tim migrasi."

    PayslipAuditNoteListResponse:
      type: object
      required: [data, has_more]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PayslipAuditNote'
        next_cursor:
          type: string
          nullable: true
        has_more:
          type: boolean

    # ───────── Export ─────────

    PayslipExportRequest:
      type: object
      description: |
        Body for `POST /payslips:export`. Either `period` or `year` MUST be
        provided. `format` is currently always `XLSX` (per D5 2026-06-02 —
        PDF deferred). `confidential` is accepted for forward compatibility
        but the server enforces `true` regardless of the client's value
        (Wave 2.8 / Wave 1.3 OptConfidential lock).
      properties:
        period:
          type: string
          description: |
            Single-period scope `YYYY-MM`. Mutually compatible with `year`;
            if both are provided, `period` wins. At least one of
            `period` / `year` is required.
          pattern: '^\d{4}-(0[1-9]|1[0-2])$'
          example: "2025-12"
        year:
          type: integer
          minimum: 2000
          maximum: 2100
          description: Full-year scope. Used when `period` is absent.
          example: 2025
        employee_ids:
          type: array
          description: |
            Optional restriction by employee. When omitted or empty, the
            export covers **all visible** payslips matching the period/year
            for the caller's RBAC scope (HR = global).
          items:
            type: string
            pattern: '^SWP-EMP-\d+$'
          example:
            - SWP-EMP-1042
            - SWP-EMP-1118
        format:
          type: string
          enum: [XLSX]
          default: XLSX
          description: |
            Output format. **XLSX only** in v1 (D5 2026-06-02). PDF
            deferred to v1.1.
        confidential:
          type: boolean
          default: true
          description: |
            Read-only at the server. Always coerced to `true` for payroll
            exports — clients may send `false` but the response will reflect
            `true`. Wave 2.8 / Wave 1.3 OptConfidential lock.
          example: true

    PayslipExportJob:
      type: object
      description: |
        Stub returned synchronously when an export is queued. The full
        export job resource (status transitions, download URL) is owned by
        **E10** — poll via `GET /api/v1/exports/{id}`.
      required: [id, status, format, confidential, requested_at, requested_by, scope, poll_url]
      properties:
        id:
          type: string
          pattern: '^SWP-EXP-\d+$'
          example: SWP-EXP-8821
        status:
          type: string
          enum: [QUEUED, RUNNING, DONE, FAILED]
          example: QUEUED
        format:
          type: string
          enum: [XLSX]
          example: XLSX
        confidential:
          type: boolean
          description: Always `true` for payroll exports (server-enforced).
          example: true
        requested_at:
          type: string
          format: date-time
          example: "2026-06-03T10:14:02Z"
        requested_by:
          type: object
          required: [id]
          properties:
            id:
              type: string
              example: SWP-EMP-9001
            name:
              type: string
              nullable: true
              example: Sari Hadi
        scope:
          type: object
          properties:
            period:
              type: string
              nullable: true
              example: "2025-12"
            year:
              type: integer
              nullable: true
              example: 2025
            employee_ids:
              type: array
              items:
                type: string
              example: []
        poll_url:
          type: string
          description: Convenience — E10 export job URL.
          example: /api/v1/exports/SWP-EXP-8821

    # ───────── Payroll Period Close (F8.5) ─────────

    EmploymentType:
      type: string
      enum: [FIELD, INTERNAL]
      description: |
        Pay model (E2, 2026-06-16). **FIELD** is attendance-gated — its blockers
        gate the lock. **INTERNAL** is fixed-monthly — shown for discipline,
        never blocks the lock (PC-5).

    PeriodStatus:
      type: string
      enum: [OPEN, LOCKED, REOPENED]
      description: |
        `PayrollPeriod` state (PC-1). `OPEN` (upstreams mutable; auto-created on
        first access) → `LOCKED` (immutable summary emitted) → super-admin
        `REOPENED` → back to `OPEN`.

    PeriodBlockerCounts:
      type: object
      description: |
        FIELD-scoped unresolved-blocker counts per completeness tab (PC-3 / PC-4).
        INTERNAL records are excluded (PC-5). A clean lock needs all three `0`.
      required: [attendance, overtime, leave]
      properties:
        attendance:
          type: integer
          minimum: 0
          description: |
            Attendance blockers (PC-3): `verification_status ∈ {PENDING,
            ESCALATED}`, open records (`check_out_at IS NULL`), `is_payable IS
            NULL` on a no-shift record, uncaptured coverage gaps.
          example: 3
        overtime:
          type: integer
          minimum: 0
          description: E7 overtime in-period with `status = PENDING` (PC-4).
          example: 1
        leave:
          type: integer
          minimum: 0
          description: E6 leave overlapping the period with `status = PENDING` (PC-4).
          example: 0

    PayrollPeriod:
      type: object
      description: |
        The month-end close gate for `(year, month)` (F8.5, PC-1). Auto-created
        `OPEN` on first access. Carries per-tab blocker counts so clients can
        render the 3-tab cockpit and gate the Lock affordance.
      required:
        - id
        - year
        - month
        - period
        - status
        - blockers
        - lockable
        - force_locked
      properties:
        id:
          type: string
          description: Period ID — `SWP-PP-<YYYY>-<MM>` per CONVENTIONS §4.
          pattern: '^SWP-PP-\d{4}-\d{2}$'
          example: SWP-PP-2025-06
        year:
          type: integer
          minimum: 2000
          maximum: 2100
          example: 2025
        month:
          type: integer
          minimum: 1
          maximum: 12
          example: 6
        period:
          type: string
          description: Convenience `YYYY-MM`.
          pattern: '^\d{4}-(0[1-9]|1[0-2])$'
          example: "2025-06"
        status:
          $ref: '#/components/schemas/PeriodStatus'
        blockers:
          $ref: '#/components/schemas/PeriodBlockerCounts'
        open_clarifications:
          type: integer
          minimum: 0
          description: Count of `OPEN` clarifications on this period's records ("awaiting reply").
          example: 2
        lockable:
          type: boolean
          description: |
            `true` iff `status = OPEN` and all three blocker counts are `0`.
            Drives the Lock affordance for ordinary HR (PC-7).
          example: false
        force_lockable:
          type: boolean
          description: |
            `true` iff the caller is super-admin and the period is `OPEN`
            (a force-lock would succeed even with non-zero blockers). Drives the
            super-admin force-lock affordance.
          example: true
        locked_by:
          type: string
          nullable: true
          description: Employee ID of who locked (null until `LOCKED`).
          example: SWP-EMP-9001
        locked_at:
          type: string
          format: date-time
          nullable: true
          example: "2025-07-01T03:22:40Z"
        force_locked:
          type: boolean
          description: Whether the lock was a super-admin force-lock (PC-7).
          example: false
        force_lock_reason:
          type: string
          nullable: true
          description: Required reason stored when `force_locked = true` (audited).
          example: null
        reopened_by:
          type: string
          nullable: true
          description: Employee ID of the super-admin who last reopened (PC-12).
          example: null
        reopened_at:
          type: string
          format: date-time
          nullable: true
          example: null

    CompletenessRow:
      type: object
      description: |
        Per-employee completeness for the period across the three upstreams
        (PC-2). INTERNAL rows are informational (their `blockers` do not gate the
        lock, PC-5) — clients distinguish via `employment_type`.
      required:
        - employee_id
        - employment_type
        - expected
        - recorded
        - clean
        - on_leave
        - coverage_gap
        - blockers
      properties:
        employee_id:
          type: string
          pattern: '^SWP-EMP-\d+$'
          example: SWP-EMP-1042
        employee_name:
          type: string
          nullable: true
          example: Budi Santoso
        employment_type:
          $ref: '#/components/schemas/EmploymentType'
        expected:
          type: integer
          minimum: 0
          description: E4 workable roster entries in-month (`is_day_off=false`, scheduled/modified, not cancelled-by-leave).
          example: 22
        recorded:
          type: integer
          minimum: 0
          description: Attendance rows recorded in-month.
          example: 21
        clean:
          type: integer
          minimum: 0
          description: Attendance with `verification_status ∈ {VERIFIED, AUTO_APPROVED}`.
          example: 19
        on_leave:
          type: integer
          minimum: 0
          description: E6 approved leave days in-month.
          example: 1
        coverage_gap:
          type: integer
          description: '`expected − (clean + on_leave)` (PC-2). May be negative if over-recorded.'
          example: 2
        blockers:
          type: integer
          minimum: 0
          description: Unresolved blockers for this employee (FIELD-gating; informational for INTERNAL).
          example: 2

    CompletenessListResponse:
      type: object
      required: [data, has_more]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CompletenessRow'
        next_cursor:
          type: string
          nullable: true
        has_more:
          type: boolean

    PeriodLockRequest:
      type: object
      description: |
        Optional body for `:lock`. An empty body performs a clean lock (requires
        zero blockers). `force` requires super-admin **and** `reason` (PC-7).
      properties:
        force:
          type: boolean
          default: false
          description: |
            Super-admin only. Override a non-zero FIELD blocker count for
            genuinely-stuck records (absconded agent). Requires `reason`.
          example: true
        reason:
          type: string
          minLength: 1
          maxLength: 1000
          description: Required when `force = true`. Stored on the period and audited.
          example: "Agen SWP-EMP-1188 kabur; record ABSENT-pending ditahan."

    PeriodReopenRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 1000
          description: Required reason for the reopen, audited (PC-12).
          example: "Koreksi lembur Juni disetujui setelah lock; perlu re-snapshot."

    PeriodEmployeeSummary:
      type: object
      description: |
        Immutable per-FIELD-employee snapshot materialized on lock (PC-8) — the
        authoritative payroll input the F8.3 run reads (PC-10). Never mutated;
        post-lock changes carry forward as `PayrollAdjustment` (PC-9). Unique
        `(period_id, employee_id)`.
      required:
        - id
        - period_id
        - employee_id
        - payable_days
        - present_days
        - late_days
        - absent_days
        - no_shift_payable_days
        - worked_minutes
        - approved_ot_minutes
        - paid_leave_days
        - unpaid_leave_days
        - created_at
      properties:
        id:
          type: string
          pattern: '^SWP-PES-\d+$'
          example: SWP-PES-55001
        period_id:
          type: string
          pattern: '^SWP-PP-\d{4}-\d{2}$'
          example: SWP-PP-2025-05
        employee_id:
          type: string
          pattern: '^SWP-EMP-\d+$'
          example: SWP-EMP-1042
        employee_name:
          type: string
          nullable: true
          example: Budi Santoso
        payable_days:
          type: integer
          minimum: 0
          description: Payable worked days (E5 per-day `is_payable`).
          example: 22
        present_days:
          type: integer
          minimum: 0
          example: 21
        late_days:
          type: integer
          minimum: 0
          example: 2
        absent_days:
          type: integer
          minimum: 0
          example: 0
        no_shift_payable_days:
          type: integer
          minimum: 0
          description: No-shift records flagged payable (`set-payable`).
          example: 1
        worked_minutes:
          type: integer
          minimum: 0
          example: 10080
        approved_ot_minutes:
          type: integer
          minimum: 0
          description: Approved E7 overtime minutes in-period (summed across tiers).
          example: 240
        paid_leave_days:
          type: integer
          minimum: 0
          example: 1
        unpaid_leave_days:
          type: integer
          minimum: 0
          example: 0
        created_at:
          type: string
          format: date-time
          description: Materialization (lock) timestamp.
          example: "2025-06-02T04:11:08Z"

    PeriodSummaryListResponse:
      type: object
      required: [data, has_more]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PeriodEmployeeSummary'
        next_cursor:
          type: string
          nullable: true
        has_more:
          type: boolean
        meta:
          type: object
          description: |
            `code: "PERIOD_NOT_LOCKED"` set on `data: []` when the period has no
            materialized summary yet (OPEN/REOPENED) — clients route to the
            "belum dikunci" state. Not an error.
          properties:
            code:
              type: string
              enum: [PERIOD_NOT_LOCKED]

    # ───────── Clarifications (F8.5, PC-13) ─────────

    ClarificationSourceType:
      type: string
      enum: [ATTENDANCE, OVERTIME, LEAVE]
      description: Which upstream record the clarification is raised against (PC-13).

    ClarificationStatus:
      type: string
      enum: [OPEN, ANSWERED, RESOLVED, CANCELLED]
      description: '`OPEN → ANSWERED → RESOLVED` (or `CANCELLED`). One round (PC-13).'

    ClarificationRequest:
      type: object
      description: |
        Thin one-round clarification on a specific upstream record (PC-13).
        Advisory — blocks no lock. The target is auto-resolved (the record's
        shift leader, else the agent) and notified via E10.
      required:
        - id
        - source_type
        - source_id
        - period_id
        - status
        - question
        - raised_by
        - target_employee_id
        - created_at
      properties:
        id:
          type: string
          pattern: '^SWP-CLR-\d+$'
          example: SWP-CLR-3001
        source_type:
          $ref: '#/components/schemas/ClarificationSourceType'
        source_id:
          type: string
          description: ID of the attendance / OT / leave record in question.
          example: SWP-ATT-77310
        period_id:
          type: string
          pattern: '^SWP-PP-\d{4}-\d{2}$'
          description: The period the source record belongs to (derived server-side).
          example: SWP-PP-2025-06
        status:
          $ref: '#/components/schemas/ClarificationStatus'
        question:
          type: string
          minLength: 1
          maxLength: 4000
          example: "Mengapa check-out kosong pada 14 Juni? Mohon konfirmasi jam pulang."
        raised_by:
          type: string
          pattern: '^SWP-EMP-\d+$'
          description: HR/super-admin who raised it.
          example: SWP-EMP-9001
        target_employee_id:
          type: string
          pattern: '^SWP-EMP-\d+$'
          description: Auto-resolved recipient — the record's shift leader, else the agent (C-PC-6).
          example: SWP-EMP-1500
        answer:
          type: string
          nullable: true
          maxLength: 4000
          description: The target's answer note (set on `:answer`).
          example: null
        answered_by:
          type: string
          nullable: true
          example: null
        answered_at:
          type: string
          format: date-time
          nullable: true
          example: null
        created_at:
          type: string
          format: date-time
          example: "2025-06-30T02:00:00Z"

    ClarificationCreate:
      type: object
      required: [source_type, source_id, question]
      description: |
        Body for `POST /clarifications`. The `period_id` and `target_employee_id`
        are resolved server-side from the source record (PC-13).
      properties:
        source_type:
          $ref: '#/components/schemas/ClarificationSourceType'
        source_id:
          type: string
          minLength: 1
          example: SWP-ATT-77310
        question:
          type: string
          minLength: 1
          maxLength: 4000
          example: "Mengapa check-out kosong pada 14 Juni?"

    ClarificationAnswer:
      type: object
      required: [answer]
      properties:
        answer:
          type: string
          minLength: 1
          maxLength: 4000
          description: The target's answer note. Filing a correction (F5.4) is a separate call.
          example: "Agen lupa absen pulang; sudah saya ajukan koreksi."

    # ───────── Errors ─────────

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: |
                UPPER_SNAKE_CASE machine-readable code. E8-specific codes:

                - `PAYSLIP_IMMUTABLE` (405) — any write to a payslip.
                - `OUT_OF_SCOPE` (403) — agent accessing another agent's payslip,
                  or a non-target answering a clarification.
                - `EXPORT_TOO_LARGE` (422) — export scope exceeds threshold.
                - `IDEMPOTENCY_KEY_REUSED` (409) — see CONVENTIONS §13.
                - `PERIOD_HAS_BLOCKERS` (422) — lock attempted with unresolved
                  FIELD blockers and `force` not set (F8.5 PC-7).
                - `PERIOD_RUN_POSTED` (409) — reopen attempted after a payroll run
                  for the month is Posted (F8.5 PC-12).
                - `CLARIFICATION_NOT_OPEN` (409) — answer/resolve/cancel on a
                  clarification not in a valid state (F8.5 PC-13).

                Cross-cutting codes per CONVENTIONS §11 also apply
                (`UNAUTHENTICATED`, `FORBIDDEN`, `NOT_FOUND`, `INVALID_REQUEST`,
                `RULE_VIOLATION`, `RATE_LIMITED`, `INTERNAL`).

                Note: `DECRYPT_FAIL` is **NOT** an error code — decrypt
                failure surfaces as a successful `200 OK` payslip response
                with `decrypt_fail: true`. Likewise `MISSING_PAYROLL_HISTORY`
                surfaces as `200 OK` with `data: []` and `meta.code`.
              example: PAYSLIP_IMMUTABLE
            message:
              type: string
              description: "Human-readable Indonesian message (or English when `Accept-Language: en-US`)."
              example: "Data payroll bersifat read-only; perubahan tidak diizinkan."
            fields:
              type: object
              description: Field-level errors (400 / 422 only).
              additionalProperties:
                type: string
            request_id:
              type: string
              description: For support/debugging.
              example: req_01J6XK7Z

  responses:

    BadRequest:
      description: Validation failed (malformed JSON, missing required, bad cursor).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalid:
              value:
                error:
                  code: INVALID_REQUEST
                  message: "Permintaan tidak valid."
                  fields:
                    period: "Format harus YYYY-MM."
                  request_id: req_01J6XK7A

    Unauthenticated:
      description: Missing or expired token. Client must re-auth (CONVENTIONS §3).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            unauth:
              value:
                error:
                  code: UNAUTHENTICATED
                  message: "Sesi Anda telah berakhir. Silakan masuk kembali."
                  request_id: req_01J6XK7B

    Forbidden:
      description: |
        Authenticated but role lacks permission. Triggered for shift_leader
        on any payroll endpoint, for agent on archive/notes/export, and for
        agent on another agent's payslip (`OUT_OF_SCOPE`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            forbidden:
              value:
                error:
                  code: FORBIDDEN
                  message: "Peran Anda tidak memiliki akses fitur ini."
                  request_id: req_01J6XK7E
            out_of_scope:
              value:
                error:
                  code: OUT_OF_SCOPE
                  message: "Slip gaji ini bukan milik Anda."
                  request_id: req_01J6XK7F

    NotFound:
      description: |
        Resource doesn't exist OR caller lacks visibility (treated the same
        per CONVENTIONS §7 to avoid leaking existence).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            not_found:
              value:
                error:
                  code: NOT_FOUND
                  message: "Slip gaji tidak ditemukan."
                  request_id: req_01J6XK7G

    PayslipImmutable:
      description: |
        Write attempted on a read-only payroll resource (INV-1 / PH-4 / PA-4;
        §8 immutable-with-audited-note decision). HR must append an audit note
        via `POST /payslips/{id}/audit-notes` instead.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            immutable:
              value:
                error:
                  code: PAYSLIP_IMMUTABLE
                  message: "Data payroll historis bersifat read-only. Gunakan catatan audit untuk anotasi."
                  request_id: req_01J6XK7H

    ClarificationNotOpen:
      description: |
        The clarification is not in a state that permits this transition
        (e.g. answering a `RESOLVED`/`CANCELLED` one, or resolving a `CANCELLED`
        one). F8.5 PC-13.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            not_open:
              value:
                error:
                  code: CLARIFICATION_NOT_OPEN
                  message: "Klarifikasi ini sudah ditutup."
                  request_id: req_01J6XK96

    RateLimited:
      description: Per-user rate limit exceeded (CONVENTIONS §19).
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds until the client may retry.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            rate_limited:
              value:
                error:
                  code: RATE_LIMITED
                  message: "Terlalu banyak permintaan. Coba lagi nanti."
                  request_id: req_01J6XK7J
