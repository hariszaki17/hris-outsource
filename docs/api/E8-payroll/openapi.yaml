                    period: "2025-05"
                    status: LOCKED
                    blockers:
                      attendance: 0
                      overtime: 0
                      leave: 0
                    open_clarifications: 0
                    lockable: false
                    force_lockable: false
                    locked_by: SWP-EMP-9001
                    locked_at: "2025-06-02T04:11:08Z"
                    force_locked: false
                    force_lock_reason: null
                    reopened_by: null
                    reopened_at: null
        '400':
