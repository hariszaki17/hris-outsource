                        employment_type: FIELD
                        expected: 22
                        recorded: 21
                        clean: 19
                        on_leave: 1
                        coverage_gap: 2
                        blockers: 2
                      - employee_id: SWP-EMP-9001
                        employee_name: Sari Hadi
                        employment_type: INTERNAL
                        expected: 0
                        recorded: 20
                        clean: 20
                        on_leave: 0
                        coverage_gap: 0
                        blockers: 0
                    next_cursor: "eyJpZCI6IlNXUC1FTVAtMTA0MiJ9"
                    has_more: true
                empty:
                  summary: Month with no attendance (C-PC-8)
                  value:
                    data: []
                    next_cursor: null
                    has_more: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
