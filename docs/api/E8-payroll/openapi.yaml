        Available only when the period is `LOCKED`. On an `OPEN` / `REOPENED`
        period (no summary materialized) the call returns `200 OK` with
        `data: []` and `meta.code: "PERIOD_NOT_LOCKED"` (not an error) so clients
        can render the "belum dikunci" state.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page of immutable per-employee summary rows.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PeriodSummaryListResponse'
              examples:
                page:
                  value:
                    data:
                      - id: SWP-PES-55001
                        period_id: SWP-PP-2025-05
                        employee_id: SWP-EMP-1042
                        employee_name: Budi Santoso
                        payable_days: 22
                        present_days: 21
                        late_days: 2
                        absent_days: 0
                        no_shift_payable_days: 1
                        worked_minutes: 10080
                        approved_ot_minutes: 240
                        paid_leave_days: 1
                        unpaid_leave_days: 0
                        created_at: "2025-06-02T04:11:08Z"
                    next_cursor: null
