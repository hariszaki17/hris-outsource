        scope: global

  /payroll-periods/{year}/{month}:lock:
    parameters:
      - $ref: '#/components/parameters/PeriodYear'
      - $ref: '#/components/parameters/PeriodMonth'

    post:
      tags: [payroll-periods]
      summary: Lock the period (emit immutable summary)
      operationId: lockPayrollPeriod
      description: |
        Transition the period `OPEN → LOCKED` (PC-7). On success the server
        materializes an **immutable** `PeriodEmployeeSummary` per FIELD employee
        (PC-8), stamps `locked_by` / `locked_at`, and audits `PERIOD_LOCKED`
        (or `PERIOD_FORCE_LOCKED`).

        **Precondition:** in-scope (FIELD) blockers across all three tabs must be
        `0`. If any remain and `force` is not set, returns `422`
        `PERIOD_HAS_BLOCKERS` with the per-tab counts in `error.fields`.

        **Force-lock (super-admin only):** `{ force: true, reason }` overrides a
        non-zero blocker count for genuinely-stuck records (e.g. an absconded
        agent). `reason` is **required** when `force` is `true`; the reason is
        stored on the period and audited. A non-super-admin sending `force: true`
        gets `403 FORBIDDEN`.

        **Idempotency:** required (CONVENTIONS §13). Re-locking an already-`LOCKED`
        period with the same key returns the same `200` period; a different body
        returns `409 IDEMPOTENCY_KEY_REUSED`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PeriodLockRequest'
            examples:
              clean_lock:
                summary: Lock with zero blockers
                value: {}
              force_lock:
                summary: Super-admin force-lock with reason
                value:
                  force: true
                  reason: "Agen SWP-EMP-1188 kabur; record ABSENT-pending ditahan, finalisasi Juni."
      responses:
        '200':
          description: Period locked; immutable summary emitted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayrollPeriod'
              examples:
                locked:
                  value:
                    id: SWP-PP-2025-06
                    year: 2025
                    month: 6
                    period: "2025-06"
                    status: LOCKED
                    blockers:
                      attendance: 0
                      overtime: 0
                      leave: 0
                    open_clarifications: 0
                    lockable: false
                    force_lockable: false
                    locked_by: SWP-EMP-9001
                    locked_at: "2025-07-01T03:22:40Z"
                    force_locked: false
                    force_lock_reason: null
                    reopened_by: null
                    reopened_at: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: |
            Caller lacks the role, or a non-super-admin sent `force: true`
            (force-lock is super-admin only, PC-7 / PC-15).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                force_not_super:
                  value:
                    error:
                      code: FORBIDDEN
                      message: "Force-lock hanya untuk super admin."
                      request_id: req_01J6XK91
        '409':
          description: Idempotency key reused with a different body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: |
            `PERIOD_HAS_BLOCKERS` — unresolved FIELD blockers remain and `force`
            was not set. The per-tab counts are returned in `error.fields`.
            `reason` missing on a `force` request also surfaces here as
            `RULE_VIOLATION`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                has_blockers:
                  value:
                    error:
                      code: PERIOD_HAS_BLOCKERS
                      message: "Tidak dapat mengunci periode: masih ada pengecualian yang belum diselesaikan."
                      fields:
                        attendance: "3 blocker belum diselesaikan."
                        overtime: "1 lembur masih PENDING."
                      request_id: req_01J6XK92
                force_no_reason:
                  value:
                    error:
                      code: RULE_VIOLATION
                      message: "Alasan wajib diisi untuk force-lock."
                      fields:
                        reason: "Wajib diisi saat force=true."
                      request_id: req_01J6XK93
        '429':
          $ref: '#/components/responses/RateLimited'
      x-rbac:
        roles: [hr_admin, super_admin]
        scope: global
        notes: "Force-lock (force=true) is super_admin only."

  /payroll-periods/{year}/{month}:reopen:
    parameters:
      - $ref: '#/components/parameters/PeriodYear'
      - $ref: '#/components/parameters/PeriodMonth'

    post:
      tags: [payroll-periods]
      summary: Reopen a locked period (super-admin)
      operationId: reopenPayrollPeriod
      description: |
        Transition `LOCKED → REOPENED → OPEN` (PC-12). **Super-admin only**,
        `reason` required, audited (`PERIOD_REOPENED`). Reopen **voids** the
        `PeriodEmployeeSummary` and returns the period to `OPEN`.

        **Precondition:** allowed only while **no** payroll run for the month is
        `Posted` — after posting, history is fixed and only `PayrollAdjustment`
        carry-forward applies (PC-9). If a run is already Posted, returns `409`
        `PERIOD_RUN_POSTED`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PeriodReopenRequest'
            examples:
              reopen:
                value:
                  reason: "Koreksi lembur Juni disetujui setelah lock; perlu re-snapshot sebelum run."
      responses:
        '200':
          description: Period reopened; summary voided; status back to OPEN.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayrollPeriod'
              examples:
                reopened:
                  value:
                    id: SWP-PP-2025-06
                    year: 2025
                    month: 6
                    period: "2025-06"
                    status: OPEN
                    blockers:
                      attendance: 0
                      overtime: 1
                      leave: 0
                    open_clarifications: 0
                    lockable: false
                    force_lockable: true
                    locked_by: null
                    locked_at: null
                    force_locked: false
                    force_lock_reason: null
                    reopened_by: SWP-EMP-9000
                    reopened_at: "2025-07-03T09:10:00Z"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            `PERIOD_RUN_POSTED` — a payroll run for the month is already Posted;
            reopen is rejected (PC-12, C-PC-9). Also `IDEMPOTENCY_KEY_REUSED`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                run_posted:
                  value:
                    error:
                      code: PERIOD_RUN_POSTED
                      message: "Periode tidak dapat dibuka kembali: run payroll sudah diposting. Gunakan penyesuaian (adjustment)."
                      request_id: req_01J6XK94
        '429':
          $ref: '#/components/responses/RateLimited'
      x-rbac:
        roles: [super_admin]
        scope: global
        notes: "Reopen is super_admin only (PC-12 / PC-15)."

  /payroll-periods/{year}/{month}/summary:
    parameters:
      - $ref: '#/components/parameters/PeriodYear'
      - $ref: '#/components/parameters/PeriodMonth'

    get:
      tags: [payroll-periods]
      summary: The immutable PeriodEmployeeSummary set (post-lock)
      operationId: getPeriodSummary
      description: |
        Returns the per-FIELD-employee `PeriodEmployeeSummary` rows materialized
        when the period was locked (PC-8) — the authoritative payroll input the
