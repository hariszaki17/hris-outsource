    get:
      tags: [payroll-periods]
      summary: Get period status + per-tab blocker counts
      operationId: getPayrollPeriod
      description: |
        Returns the `PayrollPeriod` for `(year, month)` with its status and the
        blocker counts for each of the three completeness tabs (Attendance · OT ·
        Leave). **Auto-creates** the period in `OPEN` state on first access for
        any month with attendance/schedule data (PC-1) — a `GET` is the only
        action needed to materialize it.

        **Blocker counts (PC-3 / PC-4):** FIELD-scoped only (PC-5). INTERNAL
        records appear in completeness rows but never count as blockers.
        `lockable` is `true` iff all three counts are zero (or the caller is a
        super-admin who may force-lock).
      responses:
