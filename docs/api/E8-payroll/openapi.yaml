      x-rbac:
        roles: [hr_admin, super_admin]
        scope: global

  /payroll-periods/{year}/{month}/completeness:
    parameters:
      - $ref: '#/components/parameters/PeriodYear'
      - $ref: '#/components/parameters/PeriodMonth'

    get:
      tags: [payroll-periods]
      summary: Per-employee completeness rows (cursor-paged)
      operationId: getPeriodCompleteness
      description: |
        Cursor-paged per-employee completeness for the period across the three
        upstreams (PC-2). Each row reports `expected` (E4 workable roster),
        `recorded` / `clean` attendance, `on_leave` days, and the unresolved
        `blockers` count, plus the `employment_type` (`FIELD` | `INTERNAL`).
        INTERNAL rows are included for discipline visibility but their blockers
        **do not gate the lock** (PC-5) — clients distinguish them via
        `employment_type`.

        Filter by `tab` to scope to one upstream's blockers, and by
        `blockers_only=true` to return only employees with at least one open
        blocker (the default review queue).
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: tab
          in: query
          description: Restrict the blocker breakdown to one upstream tab.
          required: false
          schema:
            type: string
            enum: [attendance, overtime, leave]
        - name: blockers_only
          in: query
          description: When `true`, return only rows with `blockers > 0`.
          required: false
          schema:
            type: boolean
            default: false
        - name: employment_type
          in: query
          description: Filter by `FIELD` or `INTERNAL`.
          required: false
          schema:
            $ref: '#/components/schemas/EmploymentType'
      responses:
        '200':
          description: Page of completeness rows.
          content:
